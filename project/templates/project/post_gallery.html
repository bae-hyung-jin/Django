{% extends "base.html" %}

{% block title %}사진 갤러리{% endblock %}

{% block content %}
    <h2 class="my-4 font-weight-bold">📸 산책로 사진 갤러리</h2>

    {% if object_list %}
    <div class="row">
        {% for post in object_list %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                <a href="{% url 'project:detail' post.id %}">
                    <img src="{{ post.photo.url }}" class="card-img-top" alt="{{ post.title }}" style="height: 220px; object-fit: cover;">
                </a>
                <div class="card-body">
                    <h6 class="card-title font-weight-bold mb-1">
                        <a href="{% url 'project:detail' post.id %}" class="text-dark">{{ post.title }}</a>
                    </h6>
                    <small class="text-muted">{{ post.location }}</small>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="alert alert-light border text-center py-5">
        <p class="text-muted mb-3">아직 등록된 사진이 없습니다.</p>
        <a href="{% url 'project:add' %}" class="btn btn-success">사진 등록하러 가기</a>
    </div>
    {% endif %}
{% endblock %}
