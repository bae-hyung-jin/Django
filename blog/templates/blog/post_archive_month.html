<h1>Post Archives for {{ month|date:"N, Y" }}</h1>
<p><a href="{% url 'blog:post_list' %}">All Posts</a></p>
<ul>
    {% for date in date_list %}
        <li style="display: inline;">
            <a href="{% url 'blog:post_day_archive' date|date:'Y' date|date:'b' date|date:'d' %}">
            {{ date|date:"d일" }}</a></li>
{% endfor %}
</ul>

<br>

<div>
    <ul>
        {% for post in object_list %}
        <li>{{ post.modify_dt|date:"Y-m-d" }}&nbsp;&nbsp;&nbsp;<a href="{{ post.get_absolute_url }}">
            <strong>{{ post.title }}</strong></a></li>
        {% endfor %}
    </ul>
</div>
